[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
solc_version = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = false
bytecode_hash = "none"
cbor_metadata = false
fs_permissions = [{ access = "read", path = "./out" }]

[fuzz]
runs = 10000
max_test_rejects = 1000000

[invariant]
runs = 1000
depth = 32
fail_on_revert = true
call_override = false

[fmt]
line_length = 120
tab_width = 4
